[project]
name = "sesame"
version = "0.2.0"
description = "Sesame: LLM-driven auth bypass analysis for rehosted IoT firmware"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.40",
    "paramiko>=3.4",
    "pexpect>=4.9",
]

[project.scripts]
sesame = "sesame.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sesame*"]
